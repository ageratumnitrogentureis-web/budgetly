[project]
name = "budgetly"
version = "0.1.0"
description = "A small command-line expense tracker."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
budgetly = "budgetly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = []
